<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entre el rito y el refugio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: contemplativa, editorial, respetuosa; poco texto a la vista, profundidad al interactuar.
   IDEA: un cuaderno de campo encuadernado: fotografía grande, notas al margen, plano trazado a mano.
   PICTURE: el plano del templo en SVG y las fotografías originales como evidencia.
   COLOUR and TYPE: marfil, carbón, dorado (eje antropológico), verde (psicológico), terracota (conexiones); Cormorant Garamond + Inter.
   LAYOUT: barra lateral oscura en escritorio, barra inferior en celular; bandas a ancho completo. */
:root{
  --ivory:#F1E8D9; --ivory2:#E8DCC6; --paper:#FAF5EC; --gold:#B4984F; --gold-d:#8C7434;
  --green:#365644; --terra:#873F35; --wood:#69402C; --coal:#252820; --ink:#252820; --mute:#5f5a4c;
  --line:rgba(37,40,32,.14); --serif:'Cormorant Garamond',Georgia,serif; --sans:Inter,system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{min-width:1180px;background:var(--ivory);color:var(--ink);font:16px/1.6 var(--sans);overflow-x:clip;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:radial-gradient(rgba(105,64,44,.08) 1px,transparent 1px);background-size:3px 3px}
#root{position:relative;z-index:1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.005em}
h1{font-size:clamp(44px,7vw,92px)} h2{font-size:clamp(32px,4.2vw,52px)} h3{font-size:26px} h4{font-size:21px}
p{margin:0 0 .8em}
.small{font-size:13px;color:var(--mute)}
.kicker{font-size:13px;color:var(--mute);margin-bottom:10px;display:flex;gap:8px;align-items:center}
.kicker i{width:22px;height:1px;background:currentColor;display:inline-block}

/* Shell */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--coal);color:var(--ivory);display:flex;flex-direction:column;padding:26px 18px 18px}
.brand{font-family:var(--serif);font-size:25px;line-height:1.05;margin:0 8px 4px;cursor:pointer;background:none;border:0;text-align:left;padding:0;color:inherit}
.brand small{display:block;font-family:var(--sans);font-size:12px;opacity:.6;margin-top:8px;line-height:1.4}
.navlist{margin-top:30px;display:flex;flex-direction:column;gap:2px}
.navbtn{display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;background:none;border:0;text-align:left;color:rgba(241,232,217,.72);font-size:15px;min-height:44px;transition:background .25s,color .25s}
.navbtn svg{width:20px;height:20px;flex:none;opacity:.8}
.navbtn:hover{background:rgba(241,232,217,.06);color:var(--ivory)}
.navbtn.on{background:rgba(180,152,79,.16);color:#f3e6c4}
.navbtn.on svg{color:var(--gold);opacity:1}
.navnum{font-family:var(--serif);font-style:italic;font-size:17px;width:16px;opacity:.55}
.side .axes{margin-top:auto;font-size:12px;line-height:1.5;opacity:.75;padding:0 8px}
.axes span{display:flex;align-items:center;gap:8px;margin:4px 0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
main{min-width:0}
.band{padding:clamp(28px,4vw,60px) clamp(18px,4.5vw,64px)}
.wrap{max-width:1480px;margin:0 auto}
.sechead{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:end;margin-bottom:28px}
.sechead p{color:var(--mute);margin:0;max-width:56ch}


.topbar{display:none;position:sticky;top:0;z-index:30;background:rgba(37,40,32,.96);color:var(--ivory);padding:12px 16px;align-items:center;justify-content:space-between;font-family:var(--serif);font-size:19px}
.topbar button{background:none;border:1px solid rgba(241,232,217,.3);border-radius:99px;font:12px var(--sans);padding:6px 12px;color:var(--ivory)}

/* Buttons & chips */
.btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 20px;border-radius:99px;border:1px solid var(--coal);background:var(--coal);color:var(--ivory);font-size:15px;font-weight:500;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;color:inherit;border-color:currentColor}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--coal)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--paper);font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:all .2s}
.chip:hover{border-color:var(--coal)}
.chip.on{background:var(--coal);border-color:var(--coal);color:var(--ivory)}
.chip .dot{width:8px;height:8px}
.link{background:none;border:0;padding:0;color:var(--terra);font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;min-height:28px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--ivory2);color:var(--wood)}
.tag.antro{background:rgba(180,152,79,.2);color:#6d5822}.tag.psi{background:rgba(54,86,68,.14);color:var(--green)}.tag.con{background:rgba(135,63,53,.12);color:var(--terra)}

/* Welcome */
.hero{position:relative;min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--coal);color:var(--ivory)}
.hero-img{position:relative;overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block;animation:slow 22s ease-out both}
@keyframes slow{from{transform:scale(1.08)}to{transform:scale(1)}}
.hero-img:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,var(--coal))}
.hero-txt{padding:clamp(32px,6vw,84px) clamp(24px,5vw,72px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.hero h1{color:#f6ecd6}
.hero h1 em{color:var(--gold);font-style:italic}
.hero .sub{font-family:var(--serif);font-size:clamp(21px,2.2vw,27px);line-height:1.3;opacity:.92}
.hero .lede{max-width:52ch;opacity:.78}
.hero .q{border-left:2px solid var(--gold);padding:6px 0 6px 18px;font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.35;color:#efe2c3}
.strip{display:flex;gap:10px}.strip img{width:84px;height:84px;object-fit:cover;border-radius:6px;opacity:.85;cursor:zoom-in}
.axiscards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.axiscard{border:1px solid rgba(241,232,217,.16);border-radius:14px;padding:16px;background:rgba(241,232,217,.03)}
.axiscard b{display:block;font-family:var(--serif);font-size:21px;font-weight:500;margin:6px 0 4px}
.axiscard p{font-size:13.5px;opacity:.75;margin:0}


/* Map */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:24px;align-items:start}

.mapcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:relative}
.maptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.zoom{display:flex;gap:4px;flex:none}.zoom button{white-space:nowrap}
.zoom button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.mapsvg{display:block;width:100%;height:auto;touch-action:none;user-select:none;background:#f6efe2}
.mapsvg .room{fill:#fbf7ef;stroke:var(--wood);stroke-width:1.6}
.mapsvg .hot{cursor:pointer}
.mapsvg .hot circle.core{transition:r .25s}
.mapsvg .hot:hover circle.core{r:15}
.mapsvg text{font-family:var(--sans);pointer-events:none}
.flow{fill:none;stroke-width:2.2;stroke-dasharray:6 7;animation:dash 1.8s linear infinite;marker-end:url(#arrow)}
@keyframes dash{to{stroke-dashoffset:-26}}
.pulse{animation:pulse 2.4s ease-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%{opacity:.55;transform:scale(.6)}100%{opacity:0;transform:scale(1.8)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.prov{margin:10px 14px 0;font-size:12px;background:rgba(250,245,236,.92);padding:6px 10px;border-radius:8px;color:var(--wood);border:1px dashed rgba(105,64,44,.4);display:inline-block}
.spacelist{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}

/* Sheet */
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;position:sticky;top:16px}

.sheet-img{position:relative;height:250px;overflow:hidden;cursor:zoom-in}
.sheet-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s}
.sheet-img:hover img{transform:scale(1.04)}
.sheet-img .ttl{position:absolute;left:0;right:0;bottom:0;padding:40px 20px 16px;color:#fff;background:linear-gradient(transparent,rgba(20,20,15,.82))}
.sheet-img .ttl h3{font-size:30px}
.sheet-body{padding:18px 20px 22px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -20px 16px;padding:0 14px;overflow-x:auto;scrollbar-width:none}
.tab{flex:none;background:none;border:0;padding:12px 8px;font-size:13.5px;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap;min-height:44px}
.tab.on{color:var(--ink);border-color:var(--gold);font-weight:500}
.bul{list-style:none;padding:0;margin:0 0 12px}
.bul li{padding:8px 0 8px 18px;position:relative;border-bottom:1px dotted var(--line);font-size:15px}
.bul li:before{content:"";position:absolute;left:2px;top:17px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.bul.g li:before{background:var(--green)}.bul.t li:before{background:var(--terra)}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory}
.thumbs img{width:86px;height:86px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none;scroll-snap-align:start}
.meta{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 12px;font-size:14px;margin:8px 0 14px}
.meta dt{color:var(--mute)}.meta dd{margin:0}
.layerpanel{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.layerbox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.layerbox h4{font-size:19px;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.layerbox button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px dotted var(--line);padding:6px 0;font-size:13.5px;min-height:34px}
.layerbox button b{font-weight:600}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .3s,transform .3s}
.card:hover{box-shadow:0 14px 36px -18px rgba(37,40,32,.45);transform:translateY(-2px)}
.card .ph{height:210px;position:relative;cursor:zoom-in;background:var(--ivory2)}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .ph .ph-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;color:var(--wood);font-family:var(--serif);font-style:italic;font-size:18px}
.card .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:25px}
.card .more{border-top:1px solid var(--line);padding-top:10px;margin-top:6px;font-size:14.5px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:6px}
.lbl{font-size:12px;color:var(--mute);display:block;margin-top:8px}
.pullq{font-family:var(--serif);font-size:22px;line-height:1.3;font-style:italic;color:var(--coal);margin:2px 0 6px}
.pullq:before{content:"«"}.pullq:after{content:"»"}
.quote{font-family:var(--serif);font-size:19px;line-height:1.38;margin:6px 0 10px;padding-left:14px;border-left:2px solid var(--green)}
.quote.syn{font-family:var(--sans);font-size:14.5px;font-style:normal;border-left-style:dashed}
.theory{background:var(--coal);color:var(--ivory);border-radius:18px;padding:28px clamp(20px,3vw,36px);display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr);gap:28px;margin-bottom:28px}
.theory ol{margin:0;padding-left:20px;font-size:15px;opacity:.88}.theory li{margin-bottom:8px}


/* Timeline */
.tl{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:10px 2px 22px;position:relative}
.tl:before{content:"";position:absolute;left:0;right:0;top:40px;height:1px;background:var(--gold)}
.tli{flex:0 0 250px;scroll-snap-align:start;background:none;border:0;text-align:left;padding:0;position:relative}
.tli .when{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--gold-d);height:28px}
.tli .pin{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:var(--ivory);margin:4px 0 14px;transition:transform .2s}
.tli.on .pin{background:var(--gold);transform:scale(1.35)}
.tli .box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;min-height:150px}
.tli.on .box{border-color:var(--gold);box-shadow:0 10px 30px -18px rgba(140,116,52,.7)}
.tli h4{font-size:20px;margin:6px 0}
.navrow{display:flex;gap:8px;justify-content:flex-end}
.tldetail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:8px}
.tldetail .im{min-height:320px;background:var(--ivory2);cursor:zoom-in}.tldetail .im img{width:100%;height:100%;max-height:520px;object-fit:cover;object-position:center 70%;display:block}
.tldetail .tx{padding:26px 26px 26px 0}


/* Network */
.netwrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px}

.fig{position:relative;min-height:460px;background:var(--paper);border:1px solid var(--line);border-radius:18px}
.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.net-node{cursor:pointer}
.net-node text{font-family:var(--serif);font-size:19px;pointer-events:none}

/* Moments */
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:4px}
.seg button{border:0;background:none;padding:0 22px;min-height:40px;border-radius:99px;font-size:15px}
.seg button.on{background:var(--coal);color:var(--ivory)}
.visits{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}


.visit{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.visit.hl{border-color:var(--gold);background:#fffaf0}
.bar{height:6px;border-radius:9px;background:var(--ivory2);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--gold)}

/* Tables */
.tablewrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-weight:600;font-size:12.5px;color:var(--mute);background:var(--ivory2);position:sticky;top:0}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;color:var(--mute);font-size:12px}.stack td:empty{display:none}}

/* Research */
.subnav{display:flex;gap:6px;overflow-x:auto;padding:10px 0 14px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--ivory)}

.subnav button{flex:none}
.rs{padding:26px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;scroll-margin-top:70px}
.rs>h3{font-size:28px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.archive{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.archive button{border:0;padding:0;background:none;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden}
.archive img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.archive button:hover img{transform:scale(1.06)}
.archive span{position:absolute;left:6px;top:6px;background:rgba(37,40,32,.78);color:#fff;font-size:11px;padding:1px 7px;border-radius:9px}
textarea.out{width:100%;min-height:120px;font:12px/1.4 ui-monospace,monospace;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}

/* Overlays */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(18,19,15,.92);display:grid;grid-template-rows:auto minmax(0,1fr) auto;color:var(--ivory);animation:fade .25s}
.ov-top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;gap:12px}
.ov-top button,.ov-nav button{background:rgba(241,232,217,.1);border:1px solid rgba(241,232,217,.25);color:var(--ivory);border-radius:99px;min-height:40px;padding:0 16px}
.ov-img{display:grid;place-items:center;padding:0 12px;min-height:0}
.ov-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.ov-cap{padding:14px 20px 22px;max-width:900px;margin:0 auto;text-align:center}
.ov-cap p{font-family:var(--serif);font-size:21px;line-height:1.3;margin-bottom:8px}
.ov-nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:90;background:rgba(18,19,15,.5);display:flex;justify-content:flex-end;animation:fade .2s}
.modal .pane{width:min(520px,100%);height:100%;overflow:auto;background:var(--paper);padding:26px 24px;box-shadow:-20px 0 50px rgba(0,0,0,.2)}
.close{float:right;background:none;border:1px solid var(--line);border-radius:99px;min-height:36px;padding:0 14px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--coal);color:var(--ivory);padding:10px 18px;border-radius:99px;font-size:14px;z-index:120;animation:fade .2s}
.empty{padding:30px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:14px}
footer{padding:28px clamp(18px,4.5vw,64px) 40px;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* ===== Desktop app layout ===== */
.side{padding:28px 20px 20px}
.terr{display:grid;grid-template-columns:minmax(0,1fr) clamp(380px,28vw,500px);min-height:100vh}
.terr-main{padding:26px 32px 32px;min-width:0}
.terr-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:16px 32px;align-items:end;margin-bottom:16px}
.terr-head h2{font-size:clamp(30px,2.4vw,38px)}
.terr-head p{font-size:14px!important;line-height:1.5;color:var(--mute);margin:0;font-size:15px}
.terr-canvas{position:relative;height:calc(100vh - 190px);min-height:620px}
.placesbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mapcard.fill .maptools{flex-wrap:nowrap;align-items:flex-start}
.mapcard.fill{height:100%;display:flex;flex-direction:column}
.mapcard.fill .mapsvg{flex:1;height:100%;min-height:0}
.float{position:absolute;z-index:3;background:rgba(250,245,236,.96);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px -22px rgba(37,40,32,.55)}
.float.layers{top:66px;left:14px;width:250px;padding:14px}
.float.layers .chip{width:100%;justify-content:flex-start;margin-bottom:6px}
.float.layers h4{font-size:19px;margin-bottom:8px}
.layerbar{flex-wrap:wrap;gap:6px}.layerbar .chip{min-height:32px;font-size:13px;padding:0 12px}
.float.places{left:50%;transform:translateX(-50%);bottom:84px;padding:6px;display:flex;gap:2px;flex-wrap:nowrap;max-width:calc(100% - 40px);overflow-x:auto}
.float.places .chip{flex:none;border:0;background:transparent}
.float.places .chip.on{background:var(--coal)}
.sheet.dock{position:sticky;top:0;height:100vh;overflow:auto;border-radius:0;border:0;border-left:1px solid var(--line)}
.sheet.dock .sheet-img{height:300px}
.layerpanel{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.withside{display:grid;grid-template-columns:300px minmax(0,1fr);gap:32px;align-items:start}
.withside>.sidepanel{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}
.sidepanel .chips{flex-direction:column;align-items:stretch}
.sidepanel .chip{justify-content:flex-start}
.toc{position:sticky;top:24px;display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--line);padding-left:4px}
.toc button{background:none;border:0;text-align:left;padding:8px 14px;font-size:14px;color:var(--mute);border-radius:8px;min-height:36px}
.toc button:hover{background:var(--paper);color:var(--ink)}
.toc button.on{color:var(--ink);background:var(--paper);font-weight:500;box-shadow:inset 2px 0 0 var(--gold)}
.grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.band{padding:44px 48px 56px}
.sechead{margin-bottom:34px}
</style>
